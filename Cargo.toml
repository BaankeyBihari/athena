[package]
name = "athena-ai-manager"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Install, pin, and sync AI agent skills and plugins from git repositories"
license = "MIT"
repository = "https://github.com/BaankeyBihari/athena"
homepage = "https://github.com/BaankeyBihari/athena"
readme = "README.md"
keywords = ["ai", "agents", "skills", "plugins", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "docs/", "AGENTS.md", "CLAUDE.md", "mise.toml"]

[lib]
name = "athena"

[[bin]]
name = "athena"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
comfy-table = "8.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml_edit = { version = "0.25.17", features = ["serde"] }
wildmatch = "2.6.1"
